# ============================================================
# docker-compose.yml — Data & Airflow Platform (DEV)
# Docker Compose v2  |  Airflow 2.9.1  |  PostgreSQL 15
# ⚠️  Hardcoded credentials — DEV ONLY, do not use in production
# ============================================================
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   Airflow UI → http://localhost:8080  (admin / admin)
# ============================================================

# Anchor 1 — environment variables only
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: "d6clCbpJSB0EpStgQjMYMPilY8VfFDvXL-6C-xtEFSA="
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow"
  AIRFLOW__WEBSERVER__SECRET_KEY: "dev_secret_key_do_not_use_in_prod"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  AIRFLOW__LOGGING__LOGGING_LEVEL: INFO

# Anchor 2 — full service definition shared by webserver, scheduler, init
x-airflow-common: &airflow-common
  image: data-airflow:latest
  environment:
    <<: *airflow-env
  volumes:
    - ../Airflow/dags:/opt/airflow/dags
    - ../Airflow/plugins:/opt/airflow/plugins
    - ../Airflow/logs:/opt/airflow/logs
    - ../data/bronze:/opt/airflow/data/raw:ro
    - ../data/silver:/opt/airflow/data/processed
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - data-net

# ============================================================
services:

  # ----------------------------------------------------------
  # PostgreSQL — Airflow metadata database
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - data-net

  # ----------------------------------------------------------
  # Airflow — DB init & first-run admin account creation
  # Owns the build — webserver & scheduler reuse the resulting image.
  # ----------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    environment:
      <<: *airflow-env
    restart: "no"

  # ----------------------------------------------------------
  # Airflow Webserver — UI on port 8080
  # ----------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------
  # Airflow Scheduler — DAG execution engine
  # ----------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

# ============================================================
volumes:
  postgres-data:
    driver: local

networks:
  data-net:
    driver: bridge